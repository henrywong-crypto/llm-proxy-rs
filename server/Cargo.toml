[package]
name = "server"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
anthropic-request = { path = "../anthropic-request" }
anthropic-response = { path = "../anthropic-response" }
aws-sdk-bedrockruntime = "1.122.0"
axum = "0.8.8"
chat = { path = "../chat" }
common = { path = "../common" }
config = "0.15.19"
request = { path = "../request" }
response = { path = "../response" }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tower = "0.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
