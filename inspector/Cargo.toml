[package]
name = "inspector"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8.8"
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
futures = "0.3"
http-body-util = "0.1"
ratatui = "0.29"
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }
serde_json = "1"
tokio = { version = "1.49.0", features = ["full"] }
tokio-stream = "0.1"
